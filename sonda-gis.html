<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Sonda GIS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body>
<h1>Sonda GIS — puente</h1>
<div id="g_id_onload"
     data-client_id="105216119388-b857t1o7huj96oit8cjebe6e2j85gdd9.apps.googleusercontent.com"
     data-callback="alTenerCredencial"
     data-auto_prompt="false"></div>
<div class="g_id_signin" data-type="standard"></div>
<pre id="salida">esperando acceso…</pre>
<script>
async function alTenerCredencial(resp) {
  const salida = document.getElementById('salida');
  const token = resp.credential;
  let aud = '';
  try { aud = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).aud; } catch(e) {}
  try {
    const r = await fetch('https://relevo-puente-xbp4ptonca-uc.a.run.app/v1/salud', { headers: { 'Authorization': 'Bearer ' + token } });
    const texto = await r.text();
    salida.textContent = 'AUD=' + aud + '\nESTADO=' + r.status + '\nCUERPO=' + texto;
  } catch (e) {
    salida.textContent = 'AUD=' + aud + '\nERROR_DE_RED=' + e.message;
  }
}
</script>
</body></html>
